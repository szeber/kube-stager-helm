image: ghcr.io/szeber/kube-stager-prometheus-static-target
imageTag: v1.0.0
service:
  labels: {}
  annotations: {}
deployment:
  labels: {}
  annotations: {}
  replicas: 1
  podLabels: {}
  podAnnotations: {}
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi
  rbacProxy:
    enabled: false
    image: quay.io/brancz/kube-rbac-proxy
    imageTag: v0.23.1
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 5m
        memory: 32Mi
rbac:
  create: true
  serviceAccount:
    name: kube-stager-prometheus-static-target-controller
    labels: {}
    annotations: {}
monitoring:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
  grafanaDashboard:
    enabled: false
    labels: {}
    annotations: {}
    folder: ""
    datasource: ""
