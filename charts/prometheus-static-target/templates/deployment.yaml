apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: controller-manager
{{- range $key, $value := .Values.deployment.labels }}
    {{ $key }}: {{ $value }}
{{- end }}
{{- if .Values.deployment.annotations }}
  annotations:
{{ toYaml .Values.deployment.annotations | indent 4 }}
{{- end }}
  name: {{ .Release.Name }}-controller-manager
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
{{- range $key, $value := .Values.deployment.podLabels }}
      {{ $key }}: {{ $value }}
{{- end }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
{{- range $key, $value := .Values.deployment.podAnnotations }}
        {{ $key }}: {{ $value }}
{{- end }}
      labels:
        control-plane: controller-manager
{{- range $key, $value := .Values.deployment.podLabels }}
        {{ $key }}: {{ $value }}
{{- end }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address={{ if (dig "rbacProxy" "enabled" false .Values.deployment) }}127.0.0.1{{ end }}:8080
        - --leader-elect
        command:
        - /manager
        image: {{ .Values.image }}:{{ .Values.imageTag }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
{{- if not (dig "rbacProxy" "enabled" false .Values.deployment) }}
        ports:
        - containerPort: 8080
          name: http-metrics
          protocol: TCP
{{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
{{ toYaml .Values.deployment.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
{{- if (dig "rbacProxy" "enabled" false .Values.deployment) }}
      - args:
        - --secure-listen-address=0.0.0.0:8443
        - --tls-cert-file=/etc/metrics-certs/tls.crt
        - --tls-private-key-file=/etc/metrics-certs/tls.key
        - --upstream=http://127.0.0.1:8080/
        image: {{ .Values.deployment.rbacProxy.image }}:{{ .Values.deployment.rbacProxy.imageTag }}
        name: kube-rbac-proxy
        ports:
        - containerPort: 8443
          name: https-metrics
          protocol: TCP
        resources:
{{ toYaml .Values.deployment.rbacProxy.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/metrics-certs
          name: metrics-cert
          readOnly: true
{{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ .Values.rbac.serviceAccount.name }}
      terminationGracePeriodSeconds: 10
{{- if (dig "rbacProxy" "enabled" false .Values.deployment) }}
      volumes:
      - name: metrics-cert
        secret:
          defaultMode: 420
          secretName: {{ .Release.Name }}-metrics-server-cert
{{- end }}
