apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-manager-config
  namespace: {{ .Release.Namespace }}
data:
  controller_manager_config.yaml: |-
{{- $config := deepCopy .Values.config }}
{{- if (dig "rbacProxy" "enabled" false .Values.deployment) }}
{{- $_ := set $config "metrics" (merge (dict "bindAddress" (include "kube-stager.proxiedMetricsAddress" .)) (default dict $config.metrics)) }}
{{- end }}
{{ toYaml $config | indent 4 }}
