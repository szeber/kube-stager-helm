{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-controller-manager-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
{{- if .Values.monitoring.serviceMonitor.labels }}
{{ toYaml .Values.monitoring.serviceMonitor.labels | indent 4 }}
{{- end }}
{{- if .Values.monitoring.serviceMonitor.annotations }}
  annotations:
{{ toYaml .Values.monitoring.serviceMonitor.annotations | indent 4 }}
{{- end }}
spec:
  endpoints:
  - path: /metrics
{{- if (dig "rbacProxy" "enabled" false .Values.deployment) }}
    port: https-metrics
    scheme: https
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      serverName: {{ .Release.Name }}-controller-manager-metrics-service.{{ .Release.Namespace }}.svc
      ca:
        secret:
          name: {{ .Release.Name }}-metrics-server-cert
          key: ca.crt
{{- else }}
    port: http-metrics
    scheme: http
{{- end }}
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
  selector:
    matchLabels:
      control-plane: controller-manager
{{- end }}
